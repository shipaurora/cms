name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, pdo_sqlite, sqlite3, zip, exif
          coverage: none

      # No lock file: a package is tested with the newest versions it allows, as sites install it.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the tests
        run: composer test
